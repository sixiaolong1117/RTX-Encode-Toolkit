name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_PATH: RTX-Encode-Toolkit.csproj
  ARTIFACT_NAME: RTX-Encode-Toolkit-win-x64
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore $env:PROJECT_PATH

      - name: Build
        run: dotnet build $env:PROJECT_PATH --configuration Release --no-restore

      - name: Publish win-x64
        run: >
          dotnet publish $env:PROJECT_PATH
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publish/${{ env.ARTIFACT_NAME }}
          -p:PublishSingleFile=false

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive `
            -Path "publish/${{ env.ARTIFACT_NAME }}/*" `
            -DestinationPath "artifacts/${{ env.ARTIFACT_NAME }}.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ env.ARTIFACT_NAME }}.zip
          generate_release_notes: true
